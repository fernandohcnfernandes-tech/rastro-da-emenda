services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: rastro
      POSTGRES_PASSWORD: rastro
      POSTGRES_DB: rastro
    ports:
      # Porta do host configurável (RASTRO_DB_PORTA no .env); padrão 5432.
      - "127.0.0.1:${RASTRO_DB_PORTA:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rastro -d rastro"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
